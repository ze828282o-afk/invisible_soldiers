<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no">
<title>Invisible Soldiers | جنود الخفاء</title>

<!-- إضافة أيقونة التبويب (Favicon) المظبوطة والمربعة -->
<link rel="icon" type="image/png" href="https://i.postimg.cc/0QRLx1C3/1784922141795-removebg-preview.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#050706;
    --bg-2:#0a0e0c;
    --grid-line: rgba(255,255,255,0.035);
    --glass: rgba(18,26,23,0.55);
    --glass-line: rgba(57,255,176,0.18);
    --accent:#39ffb0;
    --accent-dim:#1c8f5f;
    --accent-soft: rgba(57,255,176,0.12);
    --text:#e7f3ee;
    --muted:#6f8079;
    --mono: 'JetBrains Mono', monospace;
    --arabic: 'IBM Plex Sans Arabic', sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    min-height:100vh;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(57,255,176,0.07), transparent 60%),
      var(--bg);
    background-size: 34px 34px, 34px 34px, 100% 100%, 100%;
    color: var(--text);
    font-family: var(--arabic);
    overflow-x:hidden;
    position:relative;
  }

  .scan-overlay{
    position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden;
  }
  .scan-overlay::before{
    content:"";
    position:absolute; left:0; right:0; height:120px;
    top:-120px;
    background:linear-gradient(180deg, transparent, rgba(57,255,176,0.06) 45%, rgba(57,255,176,0.10) 50%, rgba(57,255,176,0.06) 55%, transparent);
    animation: sweep 7s linear infinite;
  }
  @keyframes sweep{
    0%{ top:-120px; }
    100%{ top:110vh; }
  }

  #rain{
    position:fixed; inset:0; z-index:0;
    opacity:0.16;
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .scan-overlay::before{animation:none; opacity:0;}
    #rain{ display:none; }
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .wrap{
    position:relative; z-index:1;
    max-width:640px;
    margin:0 auto;
    padding: 44px 18px 70px;
  }

  header.hero{ text-align:center; margin-bottom:40px; }

  .radar{
    width:110px; height:110px;
    margin:0 auto 20px;
    position:relative;
  }
  .radar .ring{
    position:absolute; inset:0;
    border-radius:50%;
    border:1px solid var(--glass-line);
  }
  .radar .ring.pulse{
    animation: radarpulse 2.6s ease-out infinite;
  }
  .radar .ring.pulse.delay{ animation-delay:1.3s; }
  @keyframes radarpulse{
    0%{ transform:scale(0.72); opacity:0.9; }
    100%{ transform:scale(1.35); opacity:0; }
  }
  .radar .core{
    position:absolute; inset:10px;
    border-radius:50%;
    overflow:hidden;
    background: radial-gradient(circle at 50% 35%, #10201a, #050706 75%);
    border:1px solid var(--accent-dim);
    box-shadow: 0 0 26px rgba(57,255,176,0.22), inset 0 0 18px rgba(57,255,176,0.10);
  }
  .radar .core img{ width:100%; height:100%; object-fit:cover; }

  .status{
    display:inline-flex; align-items:center; gap:8px;
    font-family: var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    color: var(--accent);
    background: var(--accent-soft);
    border:1px solid var(--glass-line);
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .status .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 8px 2px var(--accent);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  .callsign{
    font-family: var(--mono);
    letter-spacing:0.35em;
    font-size:11px;
    color: var(--muted);
    text-transform:uppercase;
    margin-bottom:10px;
  }

  h1.title{
    font-family: var(--arabic);
    font-weight:700;
    font-size:clamp(30px, 8vw, 42px);
    margin:0 0 8px;
    color: var(--text);
    letter-spacing:-0.01em;
  }
  h1.title .glow{ color: var(--accent); text-shadow:0 0 22px rgba(57,255,176,0.45); }

  .tagline{
    font-size:14.5px;
    color: var(--muted);
    max-width:320px;
    margin:0 auto;
    line-height:1.85;
  }

  .search-box{
    position:relative;
    margin-top:26px;
  }
  .search-box input{
    width:100%;
    font-family: var(--mono);
    font-size:13px;
    color: var(--text);
    background: var(--glass);
    border:1px solid var(--glass-line);
    border-radius:10px;
    padding:12px 42px 12px 14px;
    outline:none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .search-box input::placeholder{ color: var(--muted); }
  .search-box input:focus{
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px rgba(57,255,176,0.10);
  }
  .search-box .icon{
    position:absolute; top:50%; right:14px; transform:translateY(-50%);
    color: var(--accent-dim);
    pointer-events:none;
  }
  .search-box .icon svg{ width:15px; height:15px; }
  .no-results{
    display:none;
    font-family: var(--mono);
    font-size:12px;
    color: var(--muted);
    text-align:center;
    padding:30px 0;
    letter-spacing:0.05em;
  }

  nav.jump{
    position:sticky; top:0; z-index:4;
    display:flex; gap:8px; overflow-x:auto;
    padding:14px 4px;
    margin:34px -18px 0;
    padding-inline:18px;
    background: linear-gradient(180deg, var(--bg) 60%, rgba(5,7,6,0.85) 85%, transparent);
    scrollbar-width:none;
  }
  nav.jump::-webkit-scrollbar{ display:none; }
  nav.jump a{
    flex-shrink:0;
    font-family: var(--mono);
    font-size:11.5px;
    letter-spacing:0.03em;
    color: var(--muted);
    text-decoration:none;
    padding:7px 13px;
    border:1px solid var(--glass-line);
    border-radius:999px;
    background: var(--glass);
    transition: color .2s ease, border-color .2s ease, background .2s ease;
    white-space:nowrap;
  }
  nav.jump a:hover, nav.jump a:focus-visible{
    color: var(--accent);
    border-color: var(--accent-dim);
    background: var(--accent-soft);
  }

  section.group{ margin-top:40px; scroll-margin-top:64px; }

  .group-head{ margin-bottom:14px; }
  .group-head .sector{
    font-family: var(--mono);
    font-size:11px;
    letter-spacing:0.12em;
    color: var(--accent-dim);
    text-transform:uppercase;
    display:block;
    margin-bottom:4px;
  }
  .group-head h2{
    font-family: var(--arabic);
    font-size:19px;
    font-weight:700;
    color: var(--text);
    margin:0 0 8px;
  }
  .group-head .rule{
    height:1px;
    background:linear-gradient(90deg, var(--glass-line), transparent);
  }

  a.card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 18px;
    margin-bottom:10px;
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border:1px solid var(--glass-line);
    border-inline-start:2px solid var(--accent-dim);
    border-radius:10px;
    text-decoration:none;
    color: var(--text);
    position:relative;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  a.card:hover, a.card:focus-visible{
    transform: translateX(-3px);
    border-inline-start-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(57,255,176,0.12), 0 8px 24px rgba(0,0,0,0.35);
    background: rgba(24,34,30,0.7);
    outline:none;
  }
  a.card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  a.card .label{ font-size:15px; font-weight:500; line-height:1.55; }

  a.card .go{
    flex-shrink:0;
    font-family: var(--mono);
    font-size:12px;
    color: var(--accent-dim);
    border:1px solid var(--glass-line);
    border-radius:6px;
    padding:4px 8px;
    transition: color .2s ease, border-color .2s ease, transform .2s ease;
  }
  a.card:hover .go{
    color: var(--accent);
    border-color: var(--accent-dim);
    transform: translateX(-2px);
  }

  footer{ margin-top:56px; text-align:center; }
  footer .motto{
    font-family: var(--arabic);
    font-size:16px;
    color: var(--text);
    margin-bottom:20px;
  }
  .social-row{ display:flex; justify-content:center; gap:14px; margin-bottom:24px; }
  .social-row a{
    width:44px; height:44px;
    border-radius:10px;
    border:1px solid var(--glass-line);
    display:flex; align-items:center; justify-content:center;
    color: var(--accent);
    text-decoration:none;
    background: var(--glass);
    transition: all .2s ease;
  }
  .social-row a:hover{
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(57,255,176,0.25);
    transform: translateY(-2px);
  }
  .social-row svg{ width:18px; height:18px; }

  footer .fine{
    font-family: var(--mono);
    font-size:10.5px;
    letter-spacing:0.08em;
    color:#3d4842;
  }
</style>
</head>

// ---------- live search / filter ----------
const searchInput = document.getElementById('searchInput');
const noResults = document.getElementById('noResults');
const allCards = Array.from(document.querySelectorAll('a.card'));
const allSections = Array.from(document.querySelectorAll('section.group'));

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  let anyVisible = false;

  allSections.forEach(section => {
    let sectionHasMatch = false;
    section.querySelectorAll('a.card').forEach(card => {
      const match = card.dataset.label.toLowerCase().includes(q);
      card.style.display = match ? '' : 'none';
      if (match) sectionHasMatch = true;
    });
    section.style.display = (q === '' || sectionHasMatch) ? '' : 'none';
    if (sectionHasMatch || q === '') anyVisible = true;
  });

  document.getElementById('jumpNav').style.display = q === '' ? '' : 'none';
  noResults.style.display = anyVisible ? 'none' : 'block';
});

// ---------- digital rain background ----------
(function initRain(){
  const canvas = document.getElementById('rain');
  if (!canvas || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx = canvas.getContext('2d');
  const chars = 'جنودالخفاء01アイウエオカキクケコ'.split('');
  let cols, drops;

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / 18);
    drops = Array(cols).fill(0).map(() => Math.random() * -50);
  }
  resize();
  window.addEventListener('resize', resize);

  function draw(){
    ctx.fillStyle = 'rgba(5,7,6,0.10)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#39ffb0';
    ctx.font = '14px monospace';
    drops.forEach((y, i) => {
      const char = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(char, i * 18, y * 18);
      drops[i] = (y * 18 > canvas.height && Math.random() > 0.975) ? 0 : y + 1;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
